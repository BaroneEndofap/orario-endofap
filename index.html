<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orario Lezioni — Endofap Sicilia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    :root {
      --blu: #003b6f;
      --blu-light: #e8eef5;
    }

    body { background: #f5f6fa; }

    /* Header */
    .site-header {
      background: var(--blu);
      color: #fff;
      padding: 1rem 1.25rem .9rem;
    }
    .site-header .school   { font-size: .75rem; opacity: .7; letter-spacing: .08em; text-transform: uppercase; }
    .site-header .title    { font-size: 1.25rem; font-weight: 700; margin: .1rem 0 .2rem; }
    .site-header .subtitle { font-size: .78rem; opacity: .75; }

    /* Tab switcher */
    .tab-bar { display: flex; background: #fff; border-bottom: 2px solid var(--blu-light); }
    .tab-btn {
      flex: 1; padding: .7rem .5rem; border: none; background: none;
      font-weight: 600; font-size: .9rem; color: #666;
      border-bottom: 3px solid transparent; margin-bottom: -2px;
      cursor: pointer; transition: color .15s;
    }
    .tab-btn.active { color: var(--blu); border-bottom-color: var(--blu); }

    /* Ricerca */
    .search-wrap { padding: .75rem 1rem; background: #fff; border-bottom: 1px solid #eee; }
    .search-wrap input { border-radius: 2rem; background: #f5f6fa; border: 1px solid #dde; padding: .4rem 1rem; }

    /* Lista entità */
    .entity-list { padding: .5rem 0; }
    .entity-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: .7rem 1.25rem; cursor: pointer;
      border-bottom: 1px solid #f0f0f0; background: #fff;
      transition: background .1s;
    }
    .entity-item:hover, .entity-item.active { background: var(--blu-light); }
    .entity-item .name  { font-weight: 500; font-size: .95rem; color: #222; }
    .entity-item .count { font-size: .75rem; color: #888; }
    .entity-item .arrow { color: #aaa; font-size: .8rem; }

    /* Dettaglio orario */
    #dettaglio { display: none; padding: 0 0 2rem; }
    .detail-header {
      background: var(--blu); color: #fff;
      padding: .75rem 1.25rem;
      display: flex; align-items: center; gap: .75rem;
    }
    .detail-header .back-btn {
      background: none; border: none; color: #fff; opacity: .8;
      font-size: 1.1rem; cursor: pointer; padding: 0; line-height: 1;
    }
    .detail-header .detail-name { font-weight: 700; font-size: 1rem; }

    /* Griglia orario — card per giorno */
    .day-card { background: #fff; margin: .75rem 1rem 0; border-radius: .5rem; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .day-label { background: var(--blu-light); padding: .5rem .9rem; font-weight: 700; font-size: .85rem; color: var(--blu); }
    .slot-row  { display: flex; border-top: 1px solid #f0f0f0; padding: .55rem .9rem; gap: .75rem; align-items: flex-start; }
    .slot-time { min-width: 3.5rem; text-align: center; font-size: .75rem; font-weight: 700; color: #555; line-height: 1.4; white-space: nowrap; }
    .slot-time small { display: block; font-weight: 400; color: #999; }
    .slot-body { flex: 1; min-width: 0; }
    .slot-main { font-weight: 600; font-size: .9rem; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot-sub  { font-size: .78rem; color: #666; }
    .slot-tag  { font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--blu); }
    .slot-divisa { border-top: 1px dashed #e8e8e8; margin-top: .3rem; padding-top: .3rem; }
    .slot-divisa:first-child { border: none; margin: 0; padding: 0; }
    .day-empty { padding: .5rem .9rem; color: #bbb; font-size: .82rem; }

    /* Badge aggiornamento */
    .update-badge { font-size: .72rem; color: #888; text-align: center; padding: .5rem 1rem 0; }
    .update-badge span { background: #fff; border-radius: 1rem; padding: .15rem .6rem; border: 1px solid #e0e0e0; }

    /* Nessun risultato */
    .empty-msg { text-align: center; color: #aaa; padding: 3rem 1rem; font-size: .9rem; }
  </style>
</head>
<body>

<div class="site-header">
  <div class="school">Endofap Sicilia</div>
  <div class="title">Orario Lezioni</div>
  <div class="subtitle" id="hdr-meta">Caricamento in corso…</div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-docenti" onclick="switchTab('docenti')">Docenti</button>
  <button class="tab-btn"        id="tab-corsi"   onclick="switchTab('corsi')">Corsi</button>
</div>

<div id="lista-view">
  <div class="search-wrap">
    <input type="search" class="form-control" id="search-input" placeholder="Cerca…" oninput="filterList()" autocomplete="off">
  </div>
  <div class="entity-list" id="entity-list"></div>
</div>

<div id="dettaglio">
  <div class="detail-header">
    <button class="back-btn" onclick="showList()" title="Torna alla lista">&#8592;</button>
    <div class="detail-name" id="detail-name"></div>
  </div>
  <div class="update-badge" id="detail-dal"></div>
  <div id="detail-grid"></div>
</div>

<script>
const DAYS = {LUN:'Lunedì', MAR:'Martedì', MER:'Mercoledì', GIO:'Giovedì', VEN:'Venerdì'};
const DAY_ORDER = ['LUN','MAR','MER','GIO','VEN'];

let orario = null;
let currentTab = 'docenti';

// ── Caricamento dati ──────────────────────────────────────────────────────────

async function loadData() {
  try {
    const res = await fetch('data/orario.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    orario = await res.json();

    const dt = new Date(orario.aggiornato);
    const fmt = dt.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric'})
              + ' ' + dt.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
    document.getElementById('hdr-meta').textContent =
      'A.F. ' + orario.anno_formativo + '  ·  Dal ' + orario.dal;

    renderList();
  } catch (e) {
    document.getElementById('entity-list').innerHTML =
      '<div class="empty-msg">Impossibile caricare i dati.<br><small>' + e.message + '</small></div>';
    document.getElementById('hdr-meta').textContent = '';
  }
}

// ── Tab ───────────────────────────────────────────────────────────────────────

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-docenti').classList.toggle('active', tab === 'docenti');
  document.getElementById('tab-corsi').classList.toggle('active',   tab === 'corsi');
  document.getElementById('search-input').value = '';
  showList();
  renderList();
}

// ── Lista ─────────────────────────────────────────────────────────────────────

function renderList() {
  if (!orario) return;
  const q    = document.getElementById('search-input').value.toLowerCase().trim();
  const data = orario[currentTab];
  const filtered = q ? data.filter(e => e.nome.toLowerCase().includes(q)) : data;

  const el = document.getElementById('entity-list');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-msg">Nessun risultato.</div>';
    return;
  }

  el.innerHTML = filtered.map(e => {
    const count = currentTab === 'docenti' ? e.slots.length : e.lezioni.length;
    const label = currentTab === 'docenti'
      ? (count === 1 ? '1 ora' : count + ' ore')
      : (count === 1 ? '1 lezione' : count + ' lezioni');
    return `<div class="entity-item" onclick="showDetail('${esc(e.nome)}')">
      <span class="name">${esc(e.nome)}</span>
      <span>
        <span class="count">${label}</span>
        <span class="arrow ms-2">›</span>
      </span>
    </div>`;
  }).join('');
}

function filterList() { renderList(); }

// ── Dettaglio ─────────────────────────────────────────────────────────────────

function showDetail(nome) {
  if (!orario) return;
  const data = orario[currentTab];
  const entity = data.find(e => e.nome === nome);
  if (!entity) return;

  document.getElementById('detail-name').textContent = nome;
  document.getElementById('detail-dal').innerHTML =
    '<span>In vigore dal ' + orario.dal + '</span>';
  document.getElementById('detail-grid').innerHTML =
    currentTab === 'docenti' ? renderDocente(entity) : renderCorso(entity);

  document.getElementById('lista-view').style.display = 'none';
  document.getElementById('dettaglio').style.display  = 'block';
  window.scrollTo(0, 0);
}

function showList() {
  document.getElementById('lista-view').style.display = 'block';
  document.getElementById('dettaglio').style.display  = 'none';
}

// ── Rendering griglia ─────────────────────────────────────────────────────────

function renderDocente(entity) {
  // Lookup [giorno][da] → slot
  const lookup = {};
  for (const s of entity.slots) {
    (lookup[s.giorno] = lookup[s.giorno] || {})[s.da] = s;
  }

  return DAY_ORDER.map(day => {
    const slots = getTimesInDay(lookup[day]);
    const rows  = slots.length
      ? slots.map(s => `
          <div class="slot-row">
            <div class="slot-time">${s.da}<small>${s.a}</small></div>
            <div class="slot-body">
              <div class="slot-tag">${esc(s.corso)}</div>
              <div class="slot-main">${esc(s.materia)}</div>
            </div>
          </div>`)
      : [`<div class="day-empty">—</div>`];

    return `<div class="day-card">
      <div class="day-label">${DAYS[day]}</div>
      ${rows.join('')}
    </div>`;
  }).join('');
}

function renderCorso(entity) {
  const lookup = {};
  for (const l of entity.lezioni) {
    (lookup[l.giorno] = lookup[l.giorno] || {})[l.da] = l;
  }

  return DAY_ORDER.map(day => {
    const slots = getTimesInDay(lookup[day]);
    const rows  = slots.length
      ? slots.map(l => {
          if (l.tipo === 'divisa') {
            const half1 = `<div class="slot-main">${esc(l.materia)}</div>
                           <div class="slot-sub">${esc(l.docente)}</div>`;
            const half2 = `<div class="slot-main">${esc(l.materia2)}</div>
                           <div class="slot-sub">${esc(l.docente2)}</div>`;
            return `<div class="slot-row">
              <div class="slot-time">${l.da}<small>${l.a}</small></div>
              <div class="slot-body">
                <div class="slot-divisa">${half1}</div>
                <div class="slot-divisa">${half2}</div>
              </div>
            </div>`;
          }
          return `<div class="slot-row">
            <div class="slot-time">${l.da}<small>${l.a}</small></div>
            <div class="slot-body">
              <div class="slot-main">${esc(l.materia)}</div>
              <div class="slot-sub">${esc(l.docente)}</div>
            </div>
          </div>`;
        })
      : [`<div class="day-empty">—</div>`];

    return `<div class="day-card">
      <div class="day-label">${DAYS[day]}</div>
      ${rows.join('')}
    </div>`;
  }).join('');
}

// Ordina gli slot di un giorno per orario crescente
function getTimesInDay(daySlots) {
  if (!daySlots) return [];
  return Object.values(daySlots).sort((a, b) => a.da.localeCompare(b.da));
}

// Escape HTML
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Avvio ─────────────────────────────────────────────────────────────────────
loadData();
</script>

</body>
</html>
